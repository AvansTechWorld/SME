<style>

.tile{transition:transform .1s}.tile:active{transform:scale(.94)}

#pop b{display:block;font-size:46px;color:var(--ok)}#pop.show{opacity:1;pointer-events:auto;animation:pp .35s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes pp{to{transform:translate(-50%,-50%) scale(1)}}
/* UX polish: 44px touch targets, visible keyboard focus, reduced motion, desktop layout */
.b{min-height:44px}.q{width:44px;height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,[data-a]:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input:focus,select:focus{border-color:var(--ac);outline:0}input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(min-width:1000px){main{max-width:1120px}#view.stock,#view.dinau,#view.report{max-width:760px;margin:0 auto}
#view.sell{display:grid;grid-template-columns:minmax(0,1fr) 380px;column-gap:16px;align-items:start}
#view.sell>input{grid-column:1}#view.sell>.grid{grid-column:1;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}

nav,#co{max-width:1120px;margin:0 auto}nav{border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}}
#pop.show{pointer-events:none}body.co main{padding-bottom:calc(215px + env(safe-area-inset-bottom))}

@media(min-width:1000px){#view.sell>.chips{grid-column:1}#view.sell>.card{grid-row:1/span 3}}
</style>

<body>
<header><b id="store"></b><div style="display:flex;gap:14px;align-items:center"><button id="wb" data-a="who" aria-label="Who is using the app" style="background:none;border:0;color:var(--mu);font:600 12px system-ui;padding:4px"></button><button id="bell" data-a="bell" aria-label="Dinau reminders">🔔<i id="bn"></i></button><div><small>Cash in hand</small><div id="cash"></div></div></div></header>
<main><div id="bkd"></div><div id="ban"><span id="bant"></span><button class="b" id="banb">Install</button><button class="q" id="bank" aria-label="Dismiss">×</button></div><div id="view"></div></main>
<nav>
<button data-t="sell"><span>🛒</span>Sell</button><button data-t="stock"><span>📦</span>Stock</button><button data-t="dinau"><span>📒</span>Dinau</button><button data-t="report"><span>📊</span>Report</button>
</nav>
<div id="co"></div><div id="sh" role="dialog" aria-modal="true" aria-label="Dialog"></div><div id="toast"></div><div id="pop"></div>
<script>
"use strict";
const $=id=>document.getElementById(id),KEY='sme.tracker.v1';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((+n||0)*100)/100,pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const num=s=>{const n=parseFloat(String(s).replace(',','.'));return isNaN(n)?null:n};
const fresh=()=>({cfg:{store:'My Store',currency:'K',remindDays:7,rcpt:0},items:[],customers:[],txns:[],log:[]});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.items)&&Array.isArray(s.txns))return{cfg:{...fresh().cfg,...s.cfg},items:s.items,customers:s.customers||[],txns:s.txns,log:s.log||[]}}catch(x){}return fresh()}
let S=load(),C,tab='sell',cart=[],selC='',paid=null,q='',editId=null,openC=null,cq='',per=7,tt,meth='cash';
const MS=['cash','mobile'],ML={cash:'Cash',mobile:'Mobile banking'},mt=t=>t.method&&t.method!=='cash'?'mobile':'cash',CATS=['Transport','Airtime','Packaging','Rent','Other'],MV=['sale','payment','expense','draw','loan','loanpay','refund'];
function numb(){let n=Math.max(S.cfg.rcpt||0,0,...S.txns.map(t=>t.no||0));for(const t of [...S.txns].sort((a,b)=>a.ts-b.ts))if(!t.no)t.no=++n;S.cfg.rcpt=n}
numb();
const add=t=>{t.no=++S.cfg.rcpt;t.by=who||'?';S.txns.push(t);L(ACT[t.type]||t.type,sum(t))};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){toast('Could not save — storage blocked')}};
const m=n=>(n<0?'-':'')+(S.cfg.currency||'K')+Math.abs(r2(n)).toFixed(2);
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2300)}

/* ---- everything below is derived from S.txns ---- */
function calc(){const c={bought:{},sold:{},adj:{},bal:{},lastPay:{},firstCredit:{},cr:{},pay:{},oldest:{},cash:0,gp:0,sales:0,spent:0,exp:0,m:{cash:0,mobile:0},wo:0,draw:0,loans:{},loanInt:0,loanPaid:0};
for(const t of S.txns){const k=t.customerId;
 if(t.type==='sale'){const mb=Math.min(t.mob||0,t.paidNow);if(mb>0){c.m.mobile+=mb;c.m.cash+=t.paidNow-mb}else c.m[mt(t)]+=t.paidNow;c.sales+=t.total;
  for(const l of t.lines){if(l.itemId)c.sold[l.itemId]=(c.sold[l.itemId]||0)+l.qty;c.gp+=(l.price-l.cost)*l.qty}
  if(k){c.bal[k]=(c.bal[k]||0)+t.total-t.paidNow;if(t.total>t.paidNow)(c.cr[k]=c.cr[k]||[]).push({d:t.date,a:t.total-t.paidNow});
   if(t.total>t.paidNow&&(!c.firstCredit[k]||t.date<c.firstCredit[k]))c.firstCredit[k]=t.date}}
 else if(t.type==='payment'){c.m[mt(t)]+=t.amount;c.pay[k]=(c.pay[k]||0)+t.amount;c.bal[k]=(c.bal[k]||0)-t.amount;if(!(c.lastPay[k]>=t.date))c.lastPay[k]=t.date}
 else if(t.type==='cash'){c.m[mt(t)]+=t.amount}
 else if(t.type==='expense'){c.m[mt(t)]-=t.amount;c.exp+=t.amount}
 else if(t.type==='writeoff'){c.bal[k]=(c.bal[k]||0)-t.amount;c.pay[k]=(c.pay[k]||0)+t.amount;c.wo+=t.amount}
 else if(t.type==='draw'){c.m[mt(t)]-=t.amount;c.draw+=t.amount}
 else if(t.type==='loan'){c.m[mt(t)]+=t.amount;c.loans[t.id]={lender:t.lender||'Lender',principal:t.amount,owe:t.owe||t.amount,paid:0,due:t.due||'',date:t.date}}
 else if(t.type==='loanpay'){c.m[mt(t)]-=t.amount;const l=c.loans[t.loanId];if(l){l.paid+=t.amount;c.loanPaid+=t.amount;c.loanInt+=t.amount*(l.owe-l.principal)/l.owe}}
 else if(t.type==='refund'){c.sales-=t.total;for(const l of t.lines){if(l.itemId)c.sold[l.itemId]=(c.sold[l.itemId]||0)-l.qty;c.gp-=(l.price-l.cost)*l.qty}
  if(t.refundTo==='dinau'&&k){c.bal[k]=(c.bal[k]||0)-t.total;c.pay[k]=(c.pay[k]||0)+t.total}else c.m[mt(t)]-=t.total}
 else if(t.type==='restock'){if(t.note!=='Opening stock'){c.m.cash-=t.total;c.spent+=t.total}for(const l of t.lines)c.bought[l.itemId]=(c.bought[l.itemId]||0)+l.qty}
 else if(t.type==='adjust'){for(const l of t.lines)c.adj[l.itemId]=(c.adj[l.itemId]||0)+l.qty}}
for(const k in c.cr){let p=c.pay[k]||0;for(const x of c.cr[k].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0)){if(p>=x.a-.005)p-=x.a;else{c.oldest[k]=x.d;break}}}
c.cash=c.m.cash;c.money=c.m.cash+c.m.mobile;c.loanInt=r2(c.loanInt);c.loanOwed=r2(Object.values(c.loans).reduce((a,l)=>a+Math.max(0,l.owe-l.paid),0));return c}
const qty=id=>(C.bought[id]||0)+(C.adj[id]||0)-(C.sold[id]||0);
const bal=id=>r2(C.bal[id]||0);
const cu=id=>S.customers.find(c=>c.id===id);
function idle(id){const ref=C.oldest[id];if(!ref)return 0;return Math.max(0,Math.round((new Date(today()+'T00:00:00')-new Date(ref+'T00:00:00'))/864e5))}
const overdue=()=>S.customers.map(c=>({c,b:bal(c.id),d:idle(c.id)})).filter(x=>x.b>0&&x.d>=(S.cfg.remindDays||7)).sort((a,b)=>b.d-a.d);
const age=d=>d<7?'ok':d<21?'wr':d<45?'al':'bd';
const outstanding=()=>S.customers.reduce((s,c)=>s+Math.max(0,bal(c.id)),0);

let sk='',catF='all';
const hit=(i,k)=>{const h=(i.name+' '+(i.cat||'')).toLowerCase();return k.toLowerCase().split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
const catList=()=>[...new Set(S.items.map(i=>(i.cat||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
function cc(){const c=catList(),f=S.items.some(i=>i.fav),el=$('cc');if(!el)return;if(catF!=='all'&&catF!=='fav'&&!c.includes(catF)||catF==='fav'&&!f)catF='all';
 el.style.display=c.length||f?'flex':'none';el.innerHTML=[['all','All'],...(f?[['fav','★ Favourites']]:[]),...c.map(x=>[x,x])].map(([k,l])=>`<button class="b${catF===k?' pri':''}" data-a="catf" data-id="${e(k)}">${e(l)}</button>`).join('')}
function drawSl(){const L=S.items.filter(i=>hit(i,sk)).sort((a,b)=>(qty(a.id)<=a.low?0:1)-(qty(b.id)<=b.low?0:1)||a.name.localeCompare(b.name));
 $('sl').innerHTML=L.length?L.map(stockRow).join(''):'<p class="mu">'+(S.items.length?'No items match.':'No items yet. Add your first one above.')+'</p>'}
function quickTile(k){const n=/^\d+([.,]\d{1,2})?$/.test(k)?num(k):null;return n>0?`<button class="tile" data-a="quick" data-id="${n}" style="border-style:dashed"><b>➕ Quick add</b><span>${m(n)}</span><small>one-off item</small></button>`:''}
let lastSale=null;
function closeCard(){const c=(S.cfg.closes||[]).slice(-1)[0];if(!c)return'';return`<div class="stat" style="margin-bottom:8px"><small>Last cash-up · ${e(c.date)} · counted ${m(c.counted)} vs expected ${m(c.exp)}</small><b class="${c.diff<0?'bad':c.diff>0?'wr':'ok'}">${c.diff?(c.diff<0?'Short ':'Over ')+m(Math.abs(c.diff)):'Balanced ✓'}</b></div>`}
/* ---- loans and potential profit ---- */
function loanCard(){const Ls=Object.entries(C.loans).map(([id,l])=>({id,...l,b:r2(l.owe-l.paid)})).sort((a,b)=>(a.b>0?0:1)-(b.b>0?0:1)||(a.due||'9999').localeCompare(b.due||'9999'));if(!Ls.length)return'';
 return`<h3>Loans</h3>${Ls.map(l=>`<div class="card"><div class="row"><b class="grow">🏦 ${e(l.lender)}</b><b class="${l.b>0?'bad':'ok'}">${l.b>0?m(l.b)+' left':'Paid off'}</b></div><div class="mu">Borrowed ${m(l.principal)} on ${e(l.date)}${l.owe>l.principal?` · pay back ${m(l.owe)} (interest ${m(l.owe-l.principal)})`:''}${l.due?` · due ${e(l.due)}${l.b>0&&l.due<today()?' ⚠️ overdue':''}`:''}</div><div style="height:6px;border-radius:9px;background:var(--in);margin:8px 0"><div style="height:6px;border-radius:9px;background:var(--ok);width:${Math.min(100,Math.round(l.paid/l.owe*100))}%"></div></div>${l.b>0?`<button class="b wide" data-a="lpay" data-id="${l.id}">Make a repayment</button>`:''}</div>`).join('')}`}
function potCard(){const L=S.items.map(i=>({i,n:Math.max(0,qty(i.id))})).filter(x=>x.n>0).map(x=>({...x,p:x.n*(x.i.price-x.i.cost)}));if(!L.length)return'';
 const sc=r2(L.reduce((a,x)=>a+x.n*x.i.cost,0)),sr=r2(L.reduce((a,x)=>a+x.n*x.i.price,0)),pp=r2(sr-sc),mg=sr?Math.round(pp/sr*1000)/10:0,mk=sc?Math.round(pp/sc*1000)/10:0,out=outstanding(),
 T=[...L].sort((a,b)=>b.p-a.p).slice(0,5),mx=Math.max(1,...T.map(x=>x.p)),thin=L.filter(x=>x.i.price<=x.i.cost).map(x=>x.i.name),
 st=[['Stock at cost',m(sc)],['Stock at retail',m(sr)],['Potential profit',m(pp),pp<0?'bad':'ok'],['Profit margin',mg+'%',mg<0?'bad':'ok'],['Markup on cost',mk+'%'],['Worth after loans',m(C.money+out+sr-C.loanOwed),'ac']];

const hsh=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(16)};
const lh=(p,o)=>hsh(p+'|'+o.ts+'|'+o.by+'|'+o.act+'|'+o.txt);
const L=(act,txt)=>{const g=S.log||(S.log=[]),o={ts:Date.now(),by:who||'?',act,txt:txt||''};o.h=lh(g.length?g[g.length-1].h:'',o);g.push(o)};
function logBad(){const g=S.log||[],bad=new Set();let p='';g.forEach((o,i)=>{if(o.h!==lh(p,o)||(i&&o.ts<g[i-1].ts-6e4))bad.add(i);p=o.h});return bad}
const nm=t=>'R-'+String(t.no||0).padStart(5,'0');
const sum=t=>{const c=t.customerId&&cu(t.customerId);return nm(t)+' '+t.type+' '+(t.type==='sale'?m(t.total)+' ('+t.lines.map(l=>l.qty+'×'+l.name).join(', ')+')':t.lines&&t.lines.length?t.lines.map(l=>l.qty+'× '+l.name).join(', '):m(t.amount))+(c?' · '+c.name:'')+(t.note?' · '+t.note:'')};
const ACT={refund:'RETURN',loan:'LOAN TAKEN',loanpay:'LOAN REPAYMENT',sale:'SALE',payment:'PAYMENT',restock:'RESTOCK',adjust:'STOCK COUNT FIXED',expense:'EXPENSE',draw:'OWNER DRAWING',writeoff:'DEBT WRITTEN OFF',cash:'CASH ADDED/REMOVED'};
async function pickWho(){const st=S.cfg.staff||(S.cfg.staff=['Owner']);
 const v=await sheet({title:'Who is using the app?',msg:'Your name is saved with every sale and change.',fields:[{label:'Pick your name',type:'select',opts:[['','—'],...st.map(n=>[n,n])],value:who},{label:'Or add a new name'}],ok:'Continue'});
 let n=v?(v[1].trim().slice(0,30)||v[0]):who||'Unnamed';if(!n)return pickWho();
 const old=st.find(x=>x.toLowerCase()===n.toLowerCase());if(old)n=old;else{st.push(n);who=n;L('STAFF NAME ADDED',n)}
 who=n;sessionStorage.setItem('sme.who',n);L('SIGNED IN');save();header()}

/* ---- receipts ---- */
const RT={sale:'Sales receipt',payment:'Payment received',writeoff:'Bad-debt write-off',expense:'Expense voucher',draw:'Owner drawing'};
function balAt(t){const i=S.txns.indexOf(t);let b=0;S.txns.forEach((x,j)=>{if(x.customerId===t.customerId&&(x.ts<t.ts||(x.ts===t.ts&&j<=i)))b+=x.type==='sale'?x.total-x.paidNow:x.type==='payment'||x.type==='writeoff'?-x.amount:0});return r2(b)}
function rcData(t){const c=t.customerId?cu(t.customerId):null,d=new Date(t.ts),R=[['No.','R-'+String(t.no||0).padStart(5,'0')],['Date',t.date+' '+pad(d.getHours())+':'+pad(d.getMinutes())]],I=[],T=[];
 if(c)R.push(['Customer',c.name+(c.phone?' · '+c.phone:'')]);if(t.by)R.push(['By',t.by]);
 if(t.type==='sale'){t.lines.forEach(l=>I.push([l.qty+' × '+l.name+' @ '+m(l.price),m(l.qty*l.price)]));T.push(['Total',m(t.total),1]);if(t.paidNow>0)T.push(['Paid now ('+ML[mt(t)]+')',m(t.paidNow)]);const u=r2(t.total-t.paidNow);if(u>0)T.push(['On dinau (unpaid)',m(u)])}
 else{T.push([t.type==='payment'?'Received ('+ML[mt(t)]+')':t.type==='writeoff'?'Debt written off (no cash received)':t.type==='expense'?'Expense · '+(t.cat||'Other')+' ('+ML[mt(t)]+')':'Cash taken out ('+ML[mt(t)]+')',m(t.amount),1]);if(t.note)R.push(['Note',t.note])}
 if(c)T.push(['Balance owed after this',m(balAt(t))]);
 return{title:RT[t.type],R,I,T}}
function rcHTML(t){const x=rcData(t),row=(a,b,s)=>`<div class="rr${s?' rb':''}"><span>${e(a)}</span><span>${e(b)}</span></div>`;
 return`<div class="rc"><h2>${e(S.cfg.store)}</h2><div class="rt">${x.title}</div>${x.R.map(r=>row(...r)).join('')}${x.I.length?'<hr>'+x.I.map(r=>row(...r)).join(''):''}<hr>${x.T.map(r=>row(...r)).join('')}<div class="rf">Recorded in SME Tracker</div></div>`}

const ACC={Sky:'#38bdf8',Green:'#4ade80',Orange:'#fb923c',Pink:'#f472b6',Purple:'#a78bfa',Gold:'#fbbf24'};
function theme(){document.documentElement.style.setProperty('--ac',S.cfg.accent||ACC.Sky);document.documentElement.classList.toggle('light',!!S.cfg.light);document.querySelector('meta[name=theme-color]').content=S.cfg.light?'#f4f6fb':'#0b1220'}
let pt;function pop(a,b,ms){const o=$('pop');o.innerHTML=`<div>${a}</div><b>${e(b)}</b>`;o.classList.remove('show');void o.offsetWidth;o.classList.add('show');clearTimeout(pt);pt=setTimeout(()=>o.classList.remove('show'),ms)}
$('pop').onclick=()=>$('pop').classList.remove('show');
Object.assign(A,{
 given(id){paid=String(id);$('paid').value=id;hint()},
 acc(id){S.cfg.accent=id;save();theme();render()},
 mode(){S.cfg.light=!S.cfg.light;save();theme();render()},
 who(){pickWho()},
 log(){const bad=logBad(),R=(S.log||[]).map((x,i)=>`<div style="display:block"><b>${e(new Date(x.ts).toLocaleString())}</b> · ${e(x.by)}${bad.has(i)?' · ⚠️ altered or out of order':''}<br><span class="${/DELETED|EDITED/.test(x.act)?'wr':'mu'}">${e(x.act)}</span> ${e(x.txt)}</div>`).slice(-300).reverse().join(''),o=$('sh');
  o.innerHTML=`<form><b>🔍 Activity log</b><p class="${bad.size?'bad':'ok'}">${bad.size?'⚠️ '+bad.size+' entries look altered or out of time order.':'✔ No edits, gaps or clock changes found in this log.'}</p><div class="hist" style="max-height:60vh">${R||'<p class="mu">Nothing yet.</p>'}</div><button type="button" class="b wide" id="shx">Close</button></form>`;
  o.classList.add('show');$('shx').onclick=()=>o.classList.remove('show');o.onclick=ev=>{if(ev.target===o)o.classList.remove('show')}},
 meth(id){meth=id;mthUI()},
 async spend(){const v=await sheet({title:'Record expense',msg:'Not stock purchases — those are recorded when you restock.',fields:[{label:'Amount',type:'number'},{label:'Category',type:'select',opts:CATS.map(c=>[c,c]),value:'Transport'},{label:'Note (optional)'},{label:'Paid from',type:'select',opts:MS.map(k=>[k,ML[k]]),value:'cash'}],ok:'Save expense'});if(!v)return;const a=num(v[0]);if(!a||a<=0)return toast('Enter an amount');
  add({id:uid(),ts:Date.now(),date:today(),type:'expense',customerId:null,lines:[],total:0,paidNow:0,amount:r2(a),note:v[2].trim(),cat:v[1],method:v[3]});commit();toast(m(a)+' expense saved')},
 async draw(){const v=await sheet({title:'I took cash out',msg:'Money you took for yourself. It is not an expense and not profit, so it has its own line.',fields:[{label:'Amount',type:'number'},{label:'Note (optional)'},{label:'Taken from',type:'select',opts:MS.map(k=>[k,ML[k]]),value:'cash'}],ok:'Save'});if(!v)return;const a=num(v[0]);if(!a||a<=0)return toast('Enter an amount');
  add({id:uid(),ts:Date.now(),date:today(),type:'draw',customerId:null,lines:[],total:0,paidNow:0,amount:r2(a),note:v[1].trim(),method:v[2]});commit();toast(m(a)+' recorded')},
 async wo(id){const c=cu(id),b=bal(id);if(!c||b<=0)return;const v=await sheet({title:'Write off '+c.name+'?',msg:`Forgive ${m(b)} as a bad debt. It is recorded as a loss and lowers your net profit. No cash moves.`,fields:[{label:'Reason (optional)'}],ok:'Write off',danger:true});if(!v)return;
  add({id:uid(),ts:Date.now(),date:today(),type:'writeoff',customerId:id,lines:[],total:0,paidNow:0,amount:b,note:v[0].trim()});commit();toast(m(b)+' written off')},
 rc(id){const t=S.txns.find(x=>x.id===id);if(!t||!RT[t.type])return;const o=$('sh');
  o.innerHTML=`<form>${rcHTML(t)}<div class="row np" style="margin-top:10px"><button type="button" class="b" id="shx">Close</button><button type="button" class="b" data-a="rsh" data-id="${id}">Share</button><button type="button" class="b pri" onclick="print()">Print / PDF</button></div></form>`;
  o.classList.add('show');$('shx').onclick=()=>o.classList.remove('show');o.onclick=ev=>{if(ev.target===o)o.classList.remove('show')}},
 async rsh(id){const t=S.txns.find(x=>x.id===id),x=rcData(t),s=[S.cfg.store,x.title,...x.R.map(r=>r[0]+': '+r[1]),...x.I.map(r=>r.join('  ')),...x.T.map(r=>r[0]+': '+r[1])].join('\n');
  try{if(navigator.share)await navigator.share({title:x.title,text:s});else{await navigator.clipboard.writeText(s);toast('Receipt copied')}}catch(z){}},
 async bkset(){const v=await sheet({title:'Backup passphrase',msg:'Pick one passphrase you will remember. It locks your backups on this phone before they go anywhere. If you forget it, nobody can open them, so write it down somewhere safe.',fields:[{label:'Passphrase (8+ characters)',type:'password'},{label:'Repeat passphrase',type:'password'}],ok:'Set passphrase'});if(!v)return;
  if(v[0].length<8)return toast('Use at least 8 characters');if(v[0]!==v[1])return toast('Passphrases do not match');toast('Setting up…');
  const salt=crypto.getRandomValues(new Uint8Array(16)),k=await derive(v[0],salt,ITER);localStorage.setItem(BK,JSON.stringify({salt:b64(salt),iter:ITER,ver:await seal(k,'ok',VAD),last:'',auto:true}));await kset(k);dailyCheck();render();toast('Passphrase set — tap Backup now')},
 async backup(){if(!bkMeta())return A.bkset();const f=await bkFile();if(!f)return;if(await deliver(f,'SME Tracker backup')){markBk(true);toast('Backup made — save it to Proton Drive')}},
 bkauto(){const mm=bkMeta();mm.auto=mm.auto===false;localStorage.setItem(BK,JSON.stringify(mm));dailyCheck();render()},
});

/* ---- PWA: service worker + install prompt ---- */
let dp=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
function banner(){if(standalone||sessionStorage.getItem('sme.ban'))return;
 if(dp){$('bant').textContent='Install SME Tracker on your home screen to use it offline.';$('banb').style.display='';$('ban').classList.add('show')}
 else if(ios){$('bant').textContent='To install: tap Share, then “Add to Home Screen”.';$('banb').style.display='none';$('ban').classList.add('show')}}
async function doInstall(){if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('ban').classList.remove('show');const i=$('inst');if(i)i.hidden=true}
addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();dp=ev;banner();const i=$('inst');if(i)i.hidden=false});
addEventListener('appinstalled',()=>{dp=null;$('ban').classList.remove('show');toast('Installed')});
$('banb').onclick=doInstall;$('bank').onclick=()=>{sessionStorage.setItem('sme.ban','1');$('ban').classList.remove('show')};
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast('Updated — reopen the app for the new version')});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
{const qt=new URLSearchParams(location.search).get('tab');if(['sell','stock','dinau','report'].includes(qt))tab=qt}
theme();banner();render();dailyCheck();if(!who)pickWho();setInterval(dailyCheck,36e5);
if(overdue().length&&!sessionStorage.getItem('sme.nt')){sessionStorage.setItem('sme.nt','1');toast('🔔 '+overdue().length+' overdue dinau — tap the bell')}
notifyDue();
